<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIL SKIS</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    background: #000;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
}

/* Main scroll space */
.scroll-container {
    height: 700vh;
}

/* Fixed cinematic viewport */
.scene {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}

/* Mountain images */
.scene img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    opacity: 0;
    transform: scale(1.08);
    transition:
        opacity 0.35s ease,
        transform 0.8s cubic-bezier(.2,.7,.2,1);
    will-change: opacity, transform;
}

.scene img.active {
    opacity: 1;
    transform: scale(1);
}

/* Dark cinematic gradient */
.scene::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.35) 0%,
            transparent 25%,
            transparent 65%,
            rgba(0,0,0,0.5) 100%
        );
}

/* Logo */
.logo {
    position: fixed;
    top: 30px;
    left: 38px;
    z-index: 20;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 5px;
}

/* Scene counter */
.counter {
    position: fixed;
    top: 31px;
    right: 38px;
    z-index: 20;
    font-size: 12px;
    letter-spacing: 3px;
    opacity: 0.8;
}

/* Bottom text */
.bottom {
    position: fixed;
    left: 38px;
    bottom: 34px;
    z-index: 20;
}

.bottom-title {
    font-size: 12px;
    letter-spacing: 4px;
    margin-bottom: 8px;
    opacity: 0.8;
}

.bottom-sub {
    font-size: 10px;
    letter-spacing: 2px;
    opacity: 0.55;
}

/* Scroll indicator */
.scroll {
    position: fixed;
    bottom: 34px;
    right: 38px;
    z-index: 20;
    font-size: 10px;
    letter-spacing: 3px;
    opacity: 0.7;
}

/* Mobile */
@media (max-width: 700px) {
    .logo {
        top: 22px;
        left: 20px;
        font-size: 14px;
    }

    .counter {
        top: 23px;
        right: 20px;
    }

    .bottom {
        left: 20px;
        bottom: 24px;
    }

    .scroll {
        right: 20px;
        bottom: 24px;
    }
}
</style>
</head>

<body>

<div class="scene">

    <img src="01-lodge.jpg" alt="LIL SKIS Lodge">
    <img src="02-terrain-park.jpg" alt="LIL SKIS Terrain Park">
    <img src="03-chairlift.jpg" alt="LIL SKIS Chairlift">
    <img src="04-lift-middle.png" alt="LIL SKIS Lift">
    <img src="05-lift-end.png" alt="LIL SKIS Summit Lift">
    <img src="06-peak-lil-skis-run.png" alt="LIL SKIS Run">

</div>

<div class="scroll-container"></div>

<div class="logo">LIL SKIS</div>

<div class="counter">
    <span id="current">01</span> / 06
</div>

<div class="bottom">
    <div class="bottom-title" id="title">THE LODGE</div>
    <div class="bottom-sub">PARK CITY · UTAH</div>
</div>

<div class="scroll">
    ↓ SCROLL
</div>

<script>

const images = document.querySelectorAll(".scene img");
const current = document.getElementById("current");
const title = document.getElementById("title");

const titles = [
    "THE LODGE",
    "TERRAIN PARK",
    "THE ASCENT",
    "MID MOUNTAIN",
    "LAST CHAIR",
    "_LIL.SKIS"
];

function updateScene() {

    const maxScroll =
        document.documentElement.scrollHeight - window.innerHeight;

    const progress =
        window.scrollY / maxScroll;

    const sceneProgress =
        progress * images.length;

    let index =
        Math.floor(sceneProgress);

    if (index >= images.length) {
        index = images.length - 1;
    }

    images.forEach((img, i) => {

        const distance = Math.abs(sceneProgress - i);

        if (i === index) {
            img.classList.add("active");

            const zoom =
                1.06 - Math.min(distance * 0.03, 0.03);

            img.style.transform =
                `scale(${zoom})`;

        } else {
            img.classList.remove("active");
            img.style.transform = "scale(1.08)";
        }

    });

    current.textContent =
        String(index + 1).padStart(2, "0");

    title.textContent =
        titles[index];
}

window.addEventListener("scroll", updateScene);
window.addEventListener("resize", updateScene);

updateScene();

</script>

</body>
</html>

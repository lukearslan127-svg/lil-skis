<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LIL SKIS</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      background: #000;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .scroll-space {
      height: 800vh;
    }

    .mountain {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.28),
          transparent 22%,
          transparent 72%,
          rgba(0,0,0,0.25)
        );
    }

    .logo {
      position: absolute;
      top: 34px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.32em;
      white-space: nowrap;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }

    .scroll-text {
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 0.28em;
      opacity: 0.85;
      white-space: nowrap;
      text-shadow: 0 2px 15px rgba(0,0,0,0.6);
    }

    .line {
      width: 1px;
      height: 45px;
      margin: 10px auto 0;
      background: rgba(255,255,255,0.7);
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scaleY(0.55);
        transform-origin: top;
        opacity: 0.35;
      }

      50% {
        transform: scaleY(1);
        transform-origin: top;
        opacity: 1;
      }
    }

    @media (max-width: 700px) {
      .logo {
        top: 25px;
        font-size: 16px;
      }

      .scroll-text {
        bottom: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="mountain">

    <video
      id="mountainVideo"
      src="lil-skis-mountain.mp4"
      muted
      playsinline
      preload="auto">
    </video>

    <div class="overlay"></div>

    <div class="logo">
      LIL SKIS
    </div>

    <div class="scroll-text">
      SCROLL TO RIDE
      <div class="line"></div>
    </div>

  </div>

  <div class="scroll-space"></div>

  <script>
    const video = document.getElementById("mountainVideo");

    let targetTime = 0;
    let currentTime = 0;
    let duration = 0;

    video.addEventListener("loadedmetadata", () => {
      duration = video.duration;
      video.currentTime = 0;
      video.pause();
    });

    function updateScroll() {
      if (!duration) return;

      const maxScroll =
        document.documentElement.scrollHeight - window.innerHeight;

      const progress =
        Math.min(
          Math.max(window.scrollY / maxScroll, 0),
          1
        );

      targetTime = progress * duration;
    }

    window.addEventListener("scroll", updateScroll, {
      passive: true
    });

    function animate() {
      currentTime += (targetTime - currentTime) * 0.12;

      if (
        duration &&
        Math.abs(video.currentTime - currentTime) > 0.01
      ) {
        video.currentTime = currentTime;
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>
